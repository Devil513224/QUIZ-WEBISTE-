0px 60px}\n.btn{display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 18px;border-radius:10px;font:600 15px 'Hind Siliguri';border:2px solid var(--navy);background:var(--surface);color:var(--navy);cursor:pointer}\n:root[data-theme=\"dark\"] .btn{color:#fff;border-color:#3A5588}\n.btn.p{background:var(--navy);color:#fff}.btn.y{background:var(--yellow);border-color:var(--yellow);color:var(--navy)}\n.btn[disabled]{opacity:.45;cursor:not-allowed}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}\n.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}\n.tag{display:inline-block;background:#FEF3C7;color:#78350F;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600}\n.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin:10px 0 16px}.meta b{color:var(--text)}\n.muted{color:var(--muted)}\n.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}\n.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:99px;padding:6px 16px;font:500 14px 'Hind Siliguri';cursor:pointer}\n.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}\n.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 0}\n.pb{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:7px;font:600 13px 'Hind Siliguri';border:0;cursor:pointer;background:var(--soft);color:var(--muted);position:relative}\n.pb.na{background:var(--red);color:#fff}.pb.an{background:var(--green);color:#fff}.pb.mk{background:var(--purple);color:#fff;border-radius:50%}.pb.am::after{content:'';position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--surface)}\n.pb.cur{outline:3px solid var(--yellow);outline-offset:1px}\n.ex{display:grid;grid-template-columns:1fr 300px;gap:20px}\n.qh{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px;font-size:14px;color:var(--muted)}\n.q{font-size:19px;font-weight:500;margin-bottom:18px}\n.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:12px 14px;margin-bottom:10px;font:inherit;cursor:pointer}\n.opt:hover{border-color:var(--navy)}.opt.sel{border-color:var(--navy);background:var(--soft)}\n.opt.ok{border-color:var(--green);background:rgba(22,163,74,.14)}.opt.no{border-color:var(--red);background:rgba(220,38,38,.12)}\n.opt i{font-style:normal;font-weight:600;color:var(--muted);flex:none}\n.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}\n.pal{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}\n.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}\n.stat{background:var(--soft);border-radius:10px;padding:14px}.stat b{display:block;font:800 26px 'Bricolage Grotesque'}.stat span{font-size:13px;color:var(--muted)}\ntable{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:15px}\n.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--green)}\n.expl{background:var(--soft);border-radius:8px;padding:10px 14px;margin-top:6px;font-size:15px}\n.ov{position:fixed;inset:0;background:rgba(8,16,32,.6);display:grid;place-items:center;z-index:40;padding:20px}\n.md{background:var(--surface);border-radius:14px;padding:24px;max-width:440px;width:100%}\nul.ins{padding-left:20px;margin:10px 0 18px}ul.ins li{margin-bottom:6px}\n@media (max-width:860px){.ex{grid-template-columns:1fr}.top small,.sn{display:none}}\n<\/style>\n<\/head>\n<body>\n<header><div class=\"top\">\n  <img src=\"__LOGO__\" alt=\"Learn With TG logo\"><div><b>LEARN WITH TG<\/b><small>Learn Smart, Grow Every Day.<\/small><\/div>\n  <nav class=\"sn\" style=\"display:flex;gap:16px;margin-left:14px;font-size:15px\" aria-label=\"Site\"><a href=\"https://claude.ai/artifact/TePq1ooYPpoZpmgpXvYvyw\" target=\"_blank\" rel=\"noopener\" style=\"color:#C7D3E6;text-decoration:none\">Home<\/a><a href=\"https://claude.ai/artifact/QR1RgwXHisRjpa2iNpVKxm\" target=\"_blank\" rel=\"noopener\" style=\"color:#C7D3E6;text-decoration:none\">Study Hub<\/a><a href=\"https://claude.ai/artifact/QJmy83NYPwMRQxXL3gxJuJ\" target=\"_blank\" rel=\"noopener\" style=\"color:#C7D3E6;text-decoration:none\">Updates<\/a><a href=\"https://claude.ai/artifact/2BY2xaAJiLrezCraWYELiE\" target=\"_blank\" rel=\"noopener\" style=\"color:#C7D3E6;text-decoration:none\">Login<\/a><\/nav><div class=\"sp\"><\/div><div class=\"timer\" id=\"timer\" hidden>Time left <b id=\"tm\"><\/b><\/div>\n  <button class=\"ib\" id=\"theme\" aria-label=\"Toggle theme\">◐<\/button>\n<\/div><\/header>\n<main id=\"app\"><\/main>\n<div id=\"modal\"><\/div>\n\n<script>\nconst $=s=>document.querySelector(s);\nconst QS=[\n[\"gk\",\"What is the capital of West Bengal?\",[\"Howrah\",\"Kolkata\",\"Siliguri\",\"Durgapur\"],1,\"Kolkata has been the capital of West Bengal since 1947.\"],\n[\"gk\",\"Who wrote the poetry collection Gitanjali?\",[\"Rabindranath Tagore\",\"Kazi Nazrul Islam\",\"Jibanananda Das\",\"Bankim Chandra Chatterjee\"],0,\"Tagore received the 1913 Nobel Prize in Literature for Gitanjali.\"],\n[\"gk\",\"Which river is the longest in India?\",[\"Yamuna\",\"Godavari\",\"Ganga\",\"Brahmaputra\"],2,\"The Ganga is generally regarded as the longest river flowing mainly within India.\"],\n[\"gk\",\"Article 21 of the Indian Constitution protects which right?\",[\"Freedom of speech\",\"Life and personal liberty\",\"Right to property\",\"Right to education\"],1,\"Article 21 guarantees protection of life and personal liberty.\"],\n[\"gk\",\"Who was the first Prime Minister of India?\",[\"Sardar Patel\",\"Rajendra Prasad\",\"Jawaharlal Nehru\",\"Lal Bahadur Shastri\"],2,\"Jawaharlal Nehru took office on 15 August 1947.\"],\n[\"cs\",\"What does CPU stand for?\",[\"Central Processing Unit\",\"Computer Personal Unit\",\"Central Program Utility\",\"Control Processing Unit\"],0,\"The CPU is the main processor that runs instructions.\"],\n[\"cs\",\"Which of these is an output device?\",[\"Keyboard\",\"Scanner\",\"Mouse\",\"Monitor\"],3,\"A monitor displays output. The others send input to the computer.\"],\n[\"cs\",\"How many bits are in one byte?\",[\"4\",\"8\",\"16\",\"32\"],1,\"One byte equals 8 bits.\"],\n[\"cs\",\"Which shortcut copies the selected item in Windows?\",[\"Ctrl + V\",\"Ctrl + X\",\"Ctrl + C\",\"Ctrl + Z\"],2,\"Ctrl + C copies, Ctrl + V pastes, Ctrl + X cuts and Ctrl + Z undoes.\"],\n[\"cs\",\"RAM is which type of memory?\",[\"Volatile\",\"Permanent\",\"Read-only\",\"Optical\"],0,\"RAM loses its contents when power is switched off.\"]];\nconst SEC={gk:\"General Knowledge\",cs:\"Computer Knowledge\"};\nconst TESTS=[\n{id:\"dq\",type:\"Daily Quiz\",name:\"Daily GK Quiz\",secs:[\"gk\"],mins:5,neg:0},\n{id:\"mt\",type:\"Mock Test\",name:\"Free Mock Test 1: GK and Computer\",secs:[\"gk\",\"cs\"],mins:10,neg:0.25},\n{id:\"sg\",type:\"Sectional Test\",name:\"General Knowledge Sectional\",secs:[\"gk\"],mins:5,neg:0.25},\n{id:\"st\",type:\"Sectional Test\",name:\"Computer Knowledge Sectional\",secs:[\"cs\"],mins:5,neg:0.25},\n{id:\"py\",type:\"Previous-Year Paper\",name:\"Sample Paper in Previous-Year Format\",secs:[\"gk\",\"cs\"],mins:10,neg:0.25,note:\"This is a sample paper in previous-year format. It is not a real past paper.\"}];\nlet CU=null;\nfunction cuCard(){return`<div class='card' style='margin-top:16px'><span class='tag'>Demo<\/span><h2 style='font-size:21px;margin:10px 0 4px'>Custom practice test<\/h2><p class='muted' style='margin:0 0 10px'>Choose subjects, number of questions and time. Questions come in random order.<\/p><div style='display:flex;gap:16px;flex-wrap:wrap;align-items:center'><label><input type='checkbox' id='cuk-gk' checked> General Knowledge<\/label><label><input type='checkbox' id='cuk-cs' checked> Computer Knowledge<\/label><label>Questions <select id='cun'>${[3,5,10].map(n=>`<option>${n}<\/option>`).join('')}<\/select><\/label><label>Minutes <select id='cum'>${[3,5,10].map(n=>`<option>${n}<\/option>`).join('')}<\/select><\/label><button class='btn y' data-cu>Create practice test<\/button><\/div><p class='muted' id='cue' style='margin:8px 0 0'><\/p><\/div>`}\ndocument.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!('cu' in b.dataset))return;const s=['gk','cs'].filter(k=>$('#cuk-'+k).checked);if(!s.length){$('#cue').textContent='Choose at least one subject.';return}const avail=QS.filter(q=>s.includes(q[0])).length,n=Math.min(+$('#cun').value,avail);CU={id:'cu',type:'Custom Practice',name:'Custom Practice Test',secs:s,mins:+$('#cum').value,neg:0,n,shuf:1};ins('cu')});\nlet S=null,view=\"list\",lf=\"All\";\nconst fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');\nfunction qs(t,sh){let r=QS.map((q,i)=>({q,i})).filter(x=>t.secs.includes(x.q[0]));if(sh)r.sort(()=>Math.random()-.5);return t.n?r.slice(0,t.n):r}\nfunction list(){view=\"list\";$('#timer').hidden=true;\nconst L=TESTS.filter(t=>lf===\"All\"||t.type===lf);\n$('#app').innerHTML=`<h1 style=\"font-size:32px\">Quizzes and mock tests<\/h1><p class=\"muted\">All free. This page uses demo questions and checks answers in your browser. Trusted server-side scoring arrives in Phase 5.<\/p>\n<div class=\"tabs\">${[\"All\",\"Daily Quiz\",\"Mock Test\",\"Sectional Test\",\"Previous-Year Paper\"].map(c=>`<button class=\"chip ${c===lf?'on':''}\" data-f=\"${c}\">${c}<\/button>`).join('')}<\/div>\n<div class=\"grid\">${L.map(t=>`<div class=\"card\"><span class=\"tag\">${t.type} · Demo<\/span><h2 style=\"font-size:21px;margin-top:10px\">${t.name}<\/h2><div class=\"meta\"><span><b>${qs(t).length}<\/b> questions<\/span><span><b>${t.mins}<\/b> minutes<\/span><span>${t.neg?'<b>−'+t.neg+'<\/b> negative marking':'No negative marking'}<\/span><\/div><button class=\"btn p\" data-s=\"${t.id}\">View instructions<\/button><\/div>`).join('')}<\/div>${cuCard()}`}\nfunction ins(id){const t=id===\"cu\"?CU:TESTS.find(x=>x.id===id);view=\"ins\";\n$('#app').innerHTML=`<div class=\"card\" style=\"max-width:720px\"><span class=\"tag\">${t.type} · Demo<\/span><h1 style=\"font-size:28px;margin:10px 0\">${t.name}<\/h1>${t.note?`<p class=\"muted\" style=\"margin:0 0 6px\">${t.note}<\/p>`:''}\n<div class=\"meta\"><span><b>${qs(t).length}<\/b> questions<\/span><span><b>${t.mins}<\/b> minutes<\/span><span>1 mark each<\/span><\/div>\n<ul class=\"ins\"><li>The timer starts when you press Start test. The test submits itself when time ends.<\/li><li>Click an option to answer. Use Clear response to remove it.<\/li><li>Use Mark for review to flag a question you want to revisit.<\/li><li>${t.neg?'Each wrong answer deducts '+t.neg+' marks.':'There is no negative marking.'}<\/li><li>Use the question palette to jump to any question.<\/li><\/ul>\n<div class=\"acts\"><button class=\"btn\" data-back>Back<\/button><button class=\"btn y\" data-start=\"${id}\">Start test<\/button><\/div><\/div>`}\nfunction start(id){const t=id===\"cu\"?CU:TESTS.find(x=>x.id===id);const items=qs(t,t.shuf);\nS={t,items,cur:0,ans:{},mark:{},vis:{0:1},left:t.mins*60,sec:t.secs[0],log:[]};view=\"exam\";$('#timer').hidden=false;\nS.h=setInterval(()=>{S.left--;$('#tm').textContent=fmt(S.left);if(S.left<=0)submit()},1000);exam()}\nfunction st(n){const a=S.ans[n]!==undefined,m=S.mark[n];return m?(a?'mk am':'mk'):a?'an':S.vis[n]?'na':''}\nfunction exam(){const it=S.items[S.cur],q=it.q;$('#tm').textContent=fmt(S.left);S.vis[S.cur]=1;\nconst secs=S.t.secs;\n$('#app').innerHTML=`<div class=\"tabs\">${secs.map(s=>`<button class=\"chip ${s===q[0]?'on':''}\" data-sec=\"${s}\">${SEC[s]}<\/button>`).join('')}<\/div>\n<div class=\"ex\"><div class=\"card\"><div class=\"qh\"><span>Question ${S.cur+1} of ${S.items.length} · ${SEC[q[0]]}<\/span><span>+1 / ${S.t.neg?'−'+S.t.neg:'0'}<\/span><\/div>\n<div class=\"q\">${q[1]}<\/div>${q[2].map((o,i)=>`<button class=\"opt ${S.ans[S.cur]===i?'sel':''}\" data-o=\"${i}\"><i>${'ABCD'[i]}.<\/i>${o}<\/button>`).join('')}\n<div class=\"acts\"><button class=\"btn\" data-prev ${S.cur?'':'disabled'}>Previous<\/button><button class=\"btn\" data-mk>${S.mark[S.cur]?'Unmark review':'Mark for review'}<\/button><button class=\"btn\" data-clr>Clear response<\/button><button class=\"btn p\" data-next ${S.cur<S.items.length-1?'':'disabled'}>Save and next<\/button><\/div><\/div>\n<aside class=\"card\"><b>Question palette<\/b><div class=\"pal\">${S.items.map((_,n)=>`<button class=\"pb ${st(n)} ${n===S.cur?'cur':''}\" data-j=\"${n}\" aria-label=\"Question ${n+1}\">${n+1}<\/button>`).join('')}<\/div>\n<div class=\"legend\"><span><span class=\"pb an\" style=\"width:14px;height:14px\"><\/span> Answered<\/span><span><span class=\"pb na\" style=\"width:14px;height:14px\"><\/span> Not answered<\/span><span><span class=\"pb mk\" style=\"width:14px;height:14px\"><\/span> Marked<\/span><span><span class=\"pb\" style=\"width:14px;height:14px\"><\/span> Not visited<\/span><\/div>\n<button class=\"btn y\" style=\"width:100%\" data-sub>Submit test<\/button><\/aside><\/div>`}\nfunction counts(){const n=S.items.length,a=Object.keys(S.ans).length;return{a,u:n-a,m:Object.keys(S.mark).filter(k=>S.mark[k]).length}}\nfunction confirmSub(){const c=counts();$('#modal').innerHTML=`<div class=\"ov\"><div class=\"md\" role=\"dialog\" aria-modal=\"true\"><h2 style=\"font-size:22px\">Submit this test?<\/h2><p class=\"muted\">Answered: <b>${c.a}<\/b> · Unanswered: <b>${c.u}<\/b> · Marked for review: <b>${c.m}<\/b><\/p><p>You cannot change answers after submitting.<\/p><div class=\"acts\"><button class=\"btn\" data-cancel>Keep working<\/button><button class=\"btn y\" data-yes>Submit now<\/button><\/div><\/div><\/div>`}\nfunction submit(){if(!S||view!==\"exam\")return;clearInterval(S.h);$('#modal').innerHTML='';S.used=S.t.mins*60-Math.max(S.left,0);result()}\nfunction result(){view=\"res\";$('#timer').hidden=true;let c=0,w=0;const by={};\nS.items.forEach((it,n)=>{const s=it.q[0];by[s]=by[s]||{t:0,c:0,w:0};by[s].t++;if(S.ans[n]===undefined)return;if(S.ans[n]===it.q[3]){c++;by[s].c++}else{w++;by[s].w++}});\nS.r={c,w};const n=S.items.length,score=c-w*S.t.neg,acc=c+w?Math.round(c/(c+w)*100):0;\n$('#app').innerHTML=`<h1 style=\"font-size:30px\">Result: ${S.t.name}<\/h1><p class=\"muted\">Demo result calculated in your browser.<\/p>\n<div class=\"stats\"><div class=\"stat\"><b>${score.toFixed(2).replace(/\\.00$/,'')} / ${n}<\/b><span>Score<\/span><\/div><div class=\"stat\"><b>${c}<\/b><span>Correct<\/span><\/div><div class=\"stat\"><b>${w}<\/b><span>Incorrect<\/span><\/div><div class=\"stat\"><b>${n-c-w}<\/b><span>Unanswered<\/span><\/div><div class=\"stat\"><b>${acc}%<\/b><span>Accuracy<\/span><\/div><div class=\"stat\"><b>${fmt(S.used)}<\/b><span>Time taken<\/span><\/div><\/div>\n<div class=\"card\"><h2 style=\"font-size:20px;margin-bottom:8px\">Section-wise analysis<\/h2><table><tr><th>Section<\/th><th>Correct<\/th><th>Incorrect<\/th><th>Progress<\/th><\/tr>${Object.keys(by).map(s=>`<tr><td>${SEC[s]}<\/td><td>${by[s].c} / ${by[s].t}<\/td><td>${by[s].w}<\/td><td><div class=\"bar\"><i style=\"width:${by[s].c/by[s].t*100}%\"><\/i><\/div><\/td><\/tr>`).join('')}<\/table><\/div>\n<div class=\"acts\"><button class=\"btn p\" data-rev>Review answers<\/button><button class=\"btn\" data-back>All tests<\/button><button class=\"btn y\" data-start=\"${S.t.id}\">Retake test<\/button><\/div>`}\nfunction review(f){view=\"rev\";f=f||\"All\";\nconst rows=S.items.map((it,n)=>({it,n,a:S.ans[n]})).filter(x=>f===\"All\"||(f===\"Correct\"&&x.a===x.it.q[3])||(f===\"Incorrect\"&&x.a!==undefined&&x.a!==x.it.q[3])||(f===\"Unanswered\"&&x.a===undefined));\n$('#app').innerHTML=`<h1 style=\"font-size:28px;margin-bottom:12px\">Answer review<\/h1><div class=\"tabs\">${[\"All\",\"Correct\",\"Incorrect\",\"Unanswered\"].map(c=>`<button class=\"chip ${c===f?'on':''}\" data-rf=\"${c}\">${c}<\/button>`).join('')}<\/div>\n${rows.length?rows.map(({it,n,a})=>`<div class=\"card\" style=\"margin-bottom:14px\"><div class=\"qh\"><span>Question ${n+1} · ${SEC[it.q[0]]}<\/span><\/div><div class=\"q\" style=\"font-size:18px\">${it.q[1]}<\/div>${it.q[2].map((o,i)=>`<div class=\"opt ${i===it.q[3]?'ok':i===a?'no':''}\"><i>${'ABCD'[i]}.<\/i>${o}${i===it.q[3]?' (correct)':i===a?' (your answer)':''}<\/div>`).join('')}<div class=\"expl\"><b>Explanation:<\/b> ${it.q[4]}<\/div><\/div>`).join(''):'<p class=\"muted\">No questions in this group.<\/p>'}\n<div class=\"acts\"><button class=\"btn\" data-res>Back to result<\/button><button class=\"btn\" data-back>All tests<\/button><\/div>`}\ndocument.addEventListener('click',e=>{const d=e.target.closest('button');if(!d)return;const D=d.dataset;\nif('f' in D){lf=D.f;list()}else if('s' in D)ins(D.s);else if('back' in D){if(S&&S.h)clearInterval(S.h);S=null;list()}\nelse if('start' in D)start(D.start);else if('o' in D){S.ans[S.cur]=+D.o;exam()}\nelse if('clr' in D){delete S.ans[S.cur];exam()}else if('mk' in D){S.mark[S.cur]=!S.mark[S.cur];exam()}\nelse if('next' in D){S.cur++;exam()}else if('prev' in D){S.cur--;exam()}else if('j' in D){S.cur=+D.j;exam()}\nelse if('sec' in D){S.cur=S.items.findIndex(x=>x.q[0]===D.sec);exam()}\nelse if('sub' in D)confirmSub();else if('cancel' in D)$('#modal').innerHTML='';else if('yes' in D)submit();\nelse if('rev' in D)review();else if('rf' in D)review(D.rf);else if('res' in D)result()});\n$('#theme').onclick=()=>{const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark'};\nlist();\n<\/script>\n<\/body>\n<\/html>\n", "hub": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Study SON.stringify(st))}catch(e){}};\nfunction toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2400)}\nconst M=[[\"Computer Basics Notes\",\"Computer Knowledge\",32],[\"Indian Polity: Fundamental Rights\",\"Indian Polity\",24],[\"Reasoning: Series and Coding\",\"Reasoning\",40],[\"West Bengal GK Capsule\",\"West Bengal GK\",28],[\"Quantitative Aptitude Formulas\",\"Mathematics\",18],[\"General Science Quick Revision\",\"General Science\",36],[\"Indian History Timeline\",\"Indian History\",30],[\"English Grammar Essentials\",\"English\",22]];\nconst SUBJ=[\"All\",...new Set(M.map(m=>m[1]))];\nconst CO=[{n:\"Computer Fundamentals\",d:\"Hardware, software, MS Office and internet basics.\",l:[\"What is a computer?\",\"Input and output devices\",\"Memory and storage\",\"Operating systems\"]},{n:\"Indian Polity Basics\",d:\"Constitution, rights and the structure of government.\",l:[\"Making of the Constitution\",\"Fundamental Rights\",\"Parliament\"]},{n:\"West Bengal GK\",d:\"History, geography and culture of West Bengal.\",l:[\"Districts and rivers\",\"Famous personalities\",\"Festivals and culture\"]}];\nconst TX={en:\"Practice every day and your speed will improve. Accuracy matters more than speed in the beginning.\",bn:\"প্রতিদিন অনুশীলন করলে আপনার গতি বাড়বে। শুরুতে গতির চেয়ে নির্ভুলতা বেশি গুরুত্বপূর্ণ।\",hi:\"रोज़ अभ्यास करने से आपकी गति बढ़ेगी। शुरुआत में गति से ज्यादा शुद्धता महत्वपूर्ण है।\"};\nlet sub=\"All\",q=\"\",cc=null,lang=\"en\",T=null;\nfunction materials(){const L=M.map((m,i)=>({m,i})).filter(x=>(sub===\"All\"||x.m[1]===sub)&&x.m[0].toLowerCase().includes(q));\nreturn`<h1>Study materials<\/h1><p class=\"muted\">Free PDFs by subject. The files are demo entries; real PDFs are added by the admin in a later phase.<\/p>\n<div class=\"row\" style=\"margin:14px 0\"><input type=\"search\" id=\"mq\" placeholder=\"Search materials\" value=\"${q}\" aria-label=\"Search materials\"><\/div>\n<div class=\"row\" style=\"margin-bottom:18px\">${SUBJ.map(s=>`<button class=\"chip ${s===sub?'on':''}\" data-sub=\"${s}\">${s}<\/button>`).join('')}<\/div>\n<div class=\"grid\">${L.length?L.map(({m,i})=>`<div class=\"card\"><span class=\"tag\">Demo PDF<\/span><h3 style=\"margin:10px 0 4px;font-size:18px\">${m[0]}<\/h3><p class=\"muted\" style=\"margin:0 0 14px\">${m[1]} · ${m[2]} pages<\/p><div class=\"row\"><button class=\"btn p\" data-dl=\"${i}\">Download<\/button><button class=\"btn\" data-bm=\"${i}\" aria-pressed=\"${st.bm.includes(i)}\">${st.bm.includes(i)?'★ Saved':'☆ Save'}<\/button><\/div><\/div>`).join(''):'<p class=\"muted\">No materials match. Clear the search or pick another subject.<\/p>'}<\/div>`}\nfunction courses(){if(cc!==null)return course();\nreturn`<h1>Free courses<\/h1><p class=\"muted\">Every course is free. Progress is saved in this browser.<\/p><div class=\"grid\" style=\"margin-top:18px\">${CO.map((c,i)=>{const p=prog(i);return`<div class=\"card\"><h3 style=\"font-size:19px\">${c.n}<\/h3><p class=\"muted\">${c.d}<\/p><div class=\"bar\"><i style=\"width:${p}%\"><\/i><\/div><p class=\"muted\" style=\"font-size:13px;margin:6px 0 12px\">${p}% complete · ${c.l.length} lessons<\/p><button class=\"btn p\" data-c=\"${i}\">${p?'Continue':'Start course'}<\/button><\/div>`}).join('')}<\/div>`}\nconst prog=i=>Math.round(CO[i].l.filter((_,j)=>st.done.includes(i+'-'+j)).length/CO[i].l.length*100);\nfunction course(){const c=CO[cc];return`<button class=\"btn\" data-c=\"-1\">← All courses<\/button><h1 style=\"margin:16px 0 4px\">${c.n}<\/h1><p class=\"muted\">${c.d}<\/p>\n<div class=\"two\" style=\"display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-top:16px\"><div class=\"video\"><div><b>Video player layout (demo)<\/b><br>Lesson videos are connected in a later phase.<\/div><\/div>\n<div class=\"card\"><b>Lessons · ${prog(cc)}% complete<\/b><div class=\"bar\" style=\"margin:8px 0\"><i style=\"width:${prog(cc)}%\"><\/i><\/div>${c.l.map((l,j)=>`<label class=\"lesson\"><input type=\"checkbox\" data-l=\"${cc}-${j}\" ${st.done.includes(cc+'-'+j)?'checked':''}><span>${l}<\/span><\/label>`).join('')}<\/div><\/div>`}\nfunction typing(){return`<h1>Typing practice<\/h1><p class=\"muted\">Pick a language, then start typing. The 60-second timer begins on your first key. For Bengali or Hindi, switch your device keyboard to that language.<\/p>\n<div class=\"row\" style=\"margin:14px 0\">${[[\"en\",\"English\"],[\"bn\",\"বাংলা\"],[\"hi\",\"हिन्दी\"]].map(l=>`<button class=\"chip ${l[0]===lang?'on':''}\" data-lang=\"${l[0]}\">${l[1]}<\/button>`).join('')}<\/div>\n<div class=\"card\"><div class=\"ty\" id=\"ty\" aria-live=\"off\"><\/div><textarea id=\"ti\" placeholder=\"Start typing here\" aria-label=\"Typing input\" spellcheck=\"false\"><\/textarea>\n<div class=\"row\" style=\"margin-top:12px\"><span class=\"muted\" id=\"tl\">Time left: 60s<\/span><button class=\"btn\" data-reset>Restart<\/button><\/div><div id=\"tr\"><\/div><\/div>\n<div class=\"card\" style=\"margin-top:16px\"><h3 style=\"font-size:18px;margin-bottom:8px\">Attempt history<\/h3>${hist()}<\/div>`}\nconst hist=()=>st.hist.length?`<table><tr><th>Language<\/th><th>WPM<\/th><th>CPM<\/th><th>Accuracy<\/th><\/tr>${st.hist.slice(-6).reverse().map(h=>`<tr><td>${h.l}<\/td><td>${h.w}<\/td><td>${h.c}<\/td><td>${h.a}%<\/td><\/tr>`).join('')}<\/table>`:'<p class=\"muted\">No attempts yet. Finish a test to see it here.<\/p>';\nfunction paint(){const ch=Array.from(TX[lang]),v=Array.from($('#ti').value);$('#ty').innerHTML=ch.map((c,i)=>`<span class=\"${i<v.length?(v[i]===c?'ok':'bad'):i===v.length?'cur':''}\">${c}<\/span>`).join('')}\nfunction tinit(){T=null;$('#ti').value='';paint();$('#tr').innerHTML='';$('#tl').textContent='Time left: 60s';\n$('#ti').oninput=()=>{const ch=Array.from(TX[lang]),v=Array.from($('#ti').value);if(!T){T={s:Date.now()};T.h=setInterval(()=>{const l=60-Math.floor((Date.now()-T.s)/1000);$('#tl').textContent='Time left: '+Math.max(l,0)+'s';if(l<=0)fin()},250)}paint();if(v.length>=ch.length)fin()}}\nfunction fin(){if(!T||T.done)return;T.done=1;clearInterval(T.h);const ch=Array.from(TX[lang]),v=Array.from($('#ti').value);const secs=Math.max((Date.now()-T.s)/1000,1);let ok=0;v.forEach((c,i)=>{if(c===ch[i])ok++});const bad=v.length-ok;\nconst cpm=Math.round(ok/secs*60),wpm=Math.round(cpm/5),acc=v.length?Math.round(ok/v.length*100):0;$('#ti').disabled=true;\nst.hist.push({l:{en:'English',bn:'Bengali',hi:'Hindi'}[lang],w:wpm,c:cpm,a:acc});save();\n$('#tr').innerHTML=`<div class=\"stats\"><div class=\"stat\"><b>${wpm}<\/b><span>WPM<\/span><\/div><div class=\"stat\"><b>${cpm}<\/b><span>CPM<\/span><\/div><div class=\"stat\"><b>${acc}%<\/b><span>Accuracy<\/span><\/div><div class=\"stat\"><b>${ok}<\/b><span>Correct characters<\/span><\/div><div class=\"stat\"><b>${bad}<\/b><span>Incorrect characters<\/span><\/div><div class=\"stat\"><b>${Math.round(secs)}s<\/b><span>Time taken<\/span><\/div><\/div>`}\nfunction dash(){const tot=CO.reduce((a,c)=>a+c.l.length,0),best=st.hist.reduce((a,h)=>Math.max(a,h.w),0);\nreturn`<h1>Student dashboard<\/h1><p class=\"muted\">Built from what you do on this page. Quiz and mock test results will appear here once accounts are connected in Phase 2.<\/p>\n<div class=\"stats\"><div class=\"stat\"><b>${st.bm.length}<\/b><span>Saved materials<\/span><\/div><div class=\"stat\"><b>${st.done.length} / ${tot}<\/b><span>Lessons completed<\/span><\/div><div class=\"stat\"><b>${st.hist.length}<\/b><span>Typing attempts<\/span><\/div><div class=\"stat\"><b>${best||'–'}<\/b><span>Best WPM<\/span><\/div><\/div>\n<div class=\"grid\"><div class=\"card\"><h3 style=\"font-size:18px;margin-bottom:10px\">Course progress<\/h3>${CO.map((c,i)=>`<p style=\"margin:8px 0 4px\">${c.n} · ${prog(i)}%<\/p><div class=\"bar\"><i style=\"width:${prog(i)}%\"><\/i><\/div>`).join('')}<\/div>\n<div class=\"card\"><h3 style=\"font-size:18px;margin-bottom:10px\">Saved materials<\/h3>${st.bm.length?st.bm.map(i=>`<p s iv>`).join('')}<\/div><\/div>\n<div class=\"card\"><b>Today's targets<\/b>${S.tasks.map((t,i)=>`<div class=\"task\"><input type=\"checkbox\" data-td=\"${i}\" ${t.d?'checked':''} aria-label=\"Done\"><span class=\"${t.d?'dn':''}\">${t.t}<\/span><button class=\"btn sm\" data-tx=\"${i}\">Remove<\/button><\/div>`).join('')||'<p class=\"muted\">No targets yet. Add your first one below.<\/p>'}\n<div class=\"row\" style=\"margin-top:12px\"><input id=\"tn\" placeholder=\"New study target\" style=\"flex:1;min-width:200px\" aria-label=\"New target\"><button class=\"btn y\" data-ta>Add target<\/button><\/div><\/div>`}\nfunction about(){return`<h1>About Learn With TG<\/h1><div class=\"card\" style=\"max-width:720px\"><p style=\"margin-top:0\">Learn With TG is a free exam preparation platform for students across India, especially West Bengal. Learn Smart, Grow Every Day.<\/p><p class=\"muted\" style=\"margin-bottom:0\">Every quiz, mock test, PDF and course is free, with no premium plan and no locked content. This site is currently a frontend preview: all content is demo data, and real accounts and saved results start after the Firebase backend is built.<\/p><\/div>`}\nconst R={affairs,jobs,leaderboard,planner,about};\nfunction route(){const r=(location.hash||'#affairs').slice(1),k=R[r]?r:'affairs';document.querySelectorAll('nav [data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r===k));$('#app').innerHTML=R[k]();\nif(k==='affairs'){$('#cq').oninput=e=>{cq=e.target.value.toLowerCase();route();const n=$('#cq');n.focus();n.setSelectionRange(n.value.length,n.value.length)};$('#cc').onchange=e=>{cc=e.target.value;route()}}\nif(k==='planner'){$('#pe').onchange=e=>{S.exam=e.target.value;save();route()};$('#pd').onchange=e=>{S.date=e.target.value;save();route()};document.querySelectorAll('[data-pg]').forEach(i=>i.onchange=e=>{S.prog[i.dataset.pg]=+e.target.value;save();route()})}}\naddEventListener('hashchange',()=>{open=-1;route()});\ndocument.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const D=b.dataset;\nif('ct' in D){ct=D.ct;route()}else if('jt' in D){jt=D.jt;open=-1;route()}else if('lt' in D){lt=D.lt;route()}else if('jo' in D){open=open===+D.jo?-1:+D.jo;route()}\nelse if('off' in D)toast('Sample entry: no real notification link.');else if('tx' in D){S.tasks.splice(+D.tx,1);save();route()}\nelse if('ta' in D){const v=$('#tn').value.trim();if(!v)return toast('Type a target first.');S.tasks.push({t:v,d:false});save();route()}});\ndocument.addEventListener('change',e=>{if(e.target.dataset.td!==undefined){S.tasks[+e.target.dataset.td].d=e.target.checked;save();route()}});\n$('#theme').onclick=()=>{const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark'};\nroute();\n<\/script>\n<\/body>\n<\/html>\n", "account": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Account – Learn With TG<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Hind+Siliguri:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--navy:#102544;--yellow:#FACC15;--bg:#F8FAFC;--surface:#fff;--text:#0F172A;--muted:#64748B;--line:#CBD5E1;--soft:#EEF2F8;--green:#16A34A;--red:#DC2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){color-scheme:dark;--bg:#0B1730;--surface:#122443;--text:#F1F5F9;--muted:#9FB0C8;--line:#34507F;--soft:#16294B;--red:#F87171}}\n:root[data-theme=\"dark\"]{color-scheme:dark;--bg:#0B1730;--surface:#122443;--text:#F1F5F9;--muted:#9FB0C8;--line:#34507F;--soft:#16294B;--red:#F87171}\n*,*::before,*::after{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 'Hind Siligu :0;text-decoration:underline}\n:root[data-theme=\"dark\"] .lnk{color:var(--yellow)}\n.meter{height:6px;border-radius:3px;background:var(--soft);margin-top:8px;overflow:hidden}.meter i{display:block;height:100%;width:0;transition:width .2s}\n.note{background:var(--soft);border-left:4px solid var(--yellow);border-radius:8px;padding:10px 14px;font-size:14px;margin-top:18px}\n.ok{background:rgba(22,163,74,.14);border-left-color:var(--green)}\n.tabs{display:flex;gap:6px;margin:14px 0 4px;flex-wrap:wrap}\n.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:99px;padding:5px 14px;font:500 14px 'Hind Siliguri';cursor:pointer}.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}\n.sep{text-align:center;color:var(--muted);font-size:13px;margin:16px 0 0}\n@media (max-width:860px){.split{grid-template-columns:1fr}.side{padding:28px 24px;flex-direction:row;align-items:center}.side ul,.side h2{display:none}.side img{width:64px;height:64px}}\n<\/style>\n<\/head>\n<body>\n<div class=\"split\">\n<div class=\"side\"><img src=\"__LOGO__\" alt=\"Learn With TG logo\"><div><h2>Learn Smart, Grow Every Day.<\/h2><p style=\"margin:0 0 14px\">One free account for everything on Learn With TG.<\/p>\n<ul><li>Track quiz and mock test scores<\/li><li>Save study materials and continue courses<\/li><li>Study in English, Bengali or Hindi<\/li><\/ul><\/div><\/div>\n<div class=\"pane\"><div class=\"box\"><div class=\"top\" style=\"justify-content:space-between;gap:10px;flex-wrap:wrap\"><span style=\"font-size:14px;display:flex;gap:14px\"><a href=\"https://claude.ai/artifact/TePq1ooYPpoZpmgpXvYvyw\" target=\"_blank\" rel=\"noopener\">Home<\/a><a href=\"https://claude.ai/artifact/8eGj1xnCUuwHHycZEaMGqq\" target=\"_blank\" rel=\"noopener\">Tests<\/a><a href=\"https://claude.ai/artifact/QR1RgwXHisRjpa2iNpVKxm\" target=\"_blank\" rel=\"noopener\">Study Hub<\/a><a href=\"https://claude.ai/artifact/QJmy83NYPwMRQxXL3gxJuJ\" target=\"_blank\" rel=\"noopener\">Updates<\/a><\/span><button class=\"ib\" id=\"theme\" aria-label=\"Toggle theme\">◐<\/button><\/div><div id=\"app\"><\/div><\/div><\/div>\n<\/div>\n<script>\nconst $=s=>document.querySelector(s);\nlet P={name:\"Learner_4821\",email:\"\",lang:\"English\",exam:\"SSC\"};\ntry{Object.assign(P,JSON.parse(localStorage.getItem('tgp')||'{}'))}catch(e){}\nconst EM=/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;\nconst field=(id,label,type='text',extra='',val='')=>`<label for=\"${id}\">${label}<\/label><div class=\"f\"><input id=\"${id}\" type=\"${type}\" value=\"${val}\" ${extra} aria-describedby=\"${id}-e\"><\/div><div class=\"err\" id=\"${id}-e\" role=\"alert\"><\/div>`;\nconst pw=(id,label,ac)=>`<label for=\"${id}\">${label}<\/label><div class=\"f\"><input id=\"${id}\" type=\"password\" autocomplete=\"${ac}\" aria-describedby=\"${id}-e\"><button type=\"button\" class=\"eye\" data-eye=\"${id}\" aria-label=\"Show or hide password\">Show<\/button><\/div><div class=\"err\" id=\"${id}-e\" role=\"alert\"><\/div>`;\nconst V={\nlogin:()=>`<h1>Welcome back<\/h1><p class=\"muted\">Log in to continue your preparation.<\/p><form data-f=\"login\" novalidate>${field('em','Email','email','autocomplete=\"email\"')}${pw('pw','Password','current-password')}\n<div style=\"text-align:right;margin-top:8px\"><button type=\"button\" class=\"lnk\" data-go=\"forgot\">Forgot password?<\/button><\/div><button class=\"btn y\">Log in<\/button><\/form><button class=\"btn\" disabled title=\"Available only if Google login is approved and set up in Phase 2\">Continue with Google (Phase 2)<\/button><p class=\"sep\">New here? <button class=\"lnk\" data-go=\"register\">Create a free account<\/button><\/p><div id=\"msg\"><\/div>`,\nregister:()=>`<h1>Create your free account<\/h1><p class=\"muted\">No payment, ever. Pick a display name that does not reveal your real name.<\/p><form data-f=\"register\" novalidate>${field('nm','Display name','text','autocomplete=\"nickname\" maxlength=\"24\"')}${field('em','Email','email
